# 服务仅监听本机回环地址，避免开发环境默认暴露到外网。
server:
  address: 127.0.0.1
  port: 8080
  tomcat:
    threads:
      max: 32
    max-connections: 128
    accept-count: 64
    connection-timeout: 10s
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: scientific-calculator
  jackson:
    deserialization:
      # 严格拒绝未知字段和尾随 JSON，减少接口输入歧义。
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false
    parser:
      strict-duplicate-detection: true

# 应用自定义的进程内访问日志容量；超过上限后淘汰最旧记录。
calculator:
  access-log:
    capacity: 1000

logging:
  level:
    # HTTP 访问日志必须保持 INFO，确保正常调用在后台可见。
    com.example.calculator.infrastructure.logging.HttpAccessLogFilter: INFO
    org.springframework.beans.factory.support: DEBUG
  pattern:
    # 将链路标识加入所有请求线程日志，便于关联一次调用产生的日志。
    console: >-
      %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level
      requestId=%X{requestId:-} logger=%logger{36} message=%msg%n
